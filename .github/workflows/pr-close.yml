name: Close outside pull requests

on:
    pull_request_target:
        types: [opened, reopened]

permissions:
    pull-requests: write
    issues: write

jobs:
    close:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/github-script@v7
              with:
                  script: |
                      const pr = context.payload.pull_request;
                      const { owner, repo } = context.repo;
                      const number = pr.number;

                      // 维护者本人的 PR 豁免（例如发布时合并到 master）| The maintainer's own PRs are exempt (e.g. release merges into master)
                      const allowed = ['OWNER', 'MEMBER', 'COLLABORATOR'];
                      if (allowed.includes(pr.author_association)) {
                          core.info(`Author association ${pr.author_association}; exempt.`);
                          return;
                      }

                      // 维护者手动重新打开的 PR 保持打开 | A PR reopened by a maintainer stays open
                      if (context.payload.action === 'reopened') {
                          try {
                              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                                  owner, repo, username: context.payload.sender.login,
                              });
                              if (['admin', 'maintain', 'write'].includes(data.role_name)) {
                                  core.info('Reopened by a maintainer; leaving it open.');
                                  return;
                              }
                          } catch (e) {
                              if (e.status !== 404) throw e;
                          }
                      }

                      await github.rest.issues.createComment({
                          owner, repo, issue_number: number,
                          body: [
                              '感谢你愿意为 MusicFree 花时间写代码！🙏',
                              '',
                              '本项目目前不接受 Pull Request，代码改动都由维护者完成，所以这个 PR 会被关闭，还请见谅。',
                              '',
                              '如果你发现了问题或有好的想法，欢迎[提交 Issue](https://github.com/' + owner + '/' + repo + '/issues/new/choose)，也可以在 Issue 里附上这个分支的链接，维护者可能会参考你的思路来实现。详见[贡献指南](https://github.com/' + owner + '/' + repo + '/blob/dev/CONTRIBUTING.md)。',
                              '',
                              '---',
                              '',
                              'Thank you for taking the time to write code for MusicFree! 🙏',
                              '',
                              'Pull requests are not accepted at the moment — all code changes are made by the maintainer, so this pull request has been closed. Thank you for understanding.',
                              '',
                              'If you found a bug or have an idea, please [open an issue](https://github.com/' + owner + '/' + repo + '/issues/new/choose). You are welcome to link this branch there; the maintainer may use your approach as a reference. See the [Contributing Guide](https://github.com/' + owner + '/' + repo + '/blob/dev/CONTRIBUTING.md) for details.',
                          ].join('\n'),
                      });

                      await github.rest.pulls.update({
                          owner, repo, pull_number: number, state: 'closed',
                      });
