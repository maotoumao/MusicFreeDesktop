    <rect x="16" y="326" width="24" height="24" rx="2" fill="#2a2a31" />
    <rect x="48" y="331" width="96" height="6" rx="3" fill="#e8e4dc" opacity="0.55" />
    <rect x="48" y="343" width="58" height="5" rx="2" fill="#e8e4dc" opacity="0.3" />
    <circle cx="268" cy="337" r="14" fill="#d4a24c" />
    <path d="M264 330 L264 344 L274 337 Z" fill="#0e0e11" />
    <rect x="300" y="335" width="300" height="4" rx="2" fill="#ffffff" opacity="0.1" />
    <rect x="300" y="335" width="128" height="4" rx="2" fill="#d4a24c" />
</svg>
