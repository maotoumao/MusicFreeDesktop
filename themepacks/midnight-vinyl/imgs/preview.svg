        <rect x="267" y="258" width="7" height="54" rx="2" fill="url(#spectrum)" />
        <rect x="280" y="246" width="7" height="66" rx="2" fill="url(#spectrum)" />
        <rect x="293" y="260" width="7" height="52" rx="2" fill="url(#spectrum)" />
        <rect x="306" y="250" width="7" height="62" rx="2" fill="url(#spectrum)" />
