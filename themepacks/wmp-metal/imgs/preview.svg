    <rect x="14" y="86" width="80" height="9" rx="4" fill="#e2e8ef" opacity="0.28" />
    <rect x="14" y="108" width="88" height="9" rx="4" fill="#e2e8ef" opacity="0.28" />
    <rect x="8" y="122" width="124" height="22" rx="4" fill="#f0a020" opacity="0.18" />
    <rect x="14" y="128" width="76" height="9" rx="4" fill="#f0a020" opacity="0.85" />

    <!-- 列表行 -->
    <rect x="156" y="70" width="330" height="8" rx="4" fill="#e2e8ef" opacity="0.45" />
    <rect x="156" y="92" width="250" height="8" rx="4" fill="#e2e8ef" opacity="0.22" />
    <rect x="156" y="114" width="300" height="8" rx="4" fill="#e2e8ef" opacity="0.22" />
    <rect x="156" y="136" width="210" height="8" rx="4" fill="#e2e8ef" opacity="0.22" />
    <rect x="150" y="154" width="490" height="26" rx="3" fill="#f0a020" opacity="0.18" />
    <rect x="156" y="162" width="268" height="8" rx="4" fill="#f0a020" opacity="0.7" />
