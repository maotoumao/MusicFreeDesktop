<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
    <defs>
        <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#33445a" />
            <stop offset="52%" stop-color="#26323f" />
            <stop offset="100%" stop-color="#1b2530" />
        </linearGradient>
        <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#223040" />
            <stop offset="100%" stop-color="#16202a" />
        </linearGradient>
        <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#202b36" />
            <stop offset="100%" stop-color="#1a232d" />
        </linearGradient>
        <linearGradient id="spectrum" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#f0a020" stop-opacity="0.75" />
            <stop offset="60%" stop-color="#f0a020" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#ffd166" stop-opacity="0.05" />
        </linearGradient>
    </defs>

    <rect width="640" height="360" fill="#232c36" />

    <!-- 标题栏 -->
    <rect width="640" height="46" fill="url(#header)" />
    <rect y="45" width="640" height="1" fill="#000000" opacity="0.55" />
    <rect x="20" y="16" width="84" height="14" rx="3" fill="#e6edf5" opacity="0.85" />
    <rect x="120" y="12" width="150" height="22" rx="4" fill="#000000" opacity="0.3" />
    <circle cx="596" cy="23" r="6" fill="#e6edf5" opacity="0.4" />

    <!-- 侧栏 -->
    <rect y="46" width="140" height="268" fill="url(#side)" />
