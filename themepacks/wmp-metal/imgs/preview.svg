        <rect x="150" y="252" width="7" height="60" rx="2" fill="url(#spectrum)" />
        <rect x="163" y="232" width="7" height="80" rx="2" fill="url(#spectrum)" />
        <rect x="176" y="246" width="7" height="66" rx="2" fill="url(#spectrum)" />
        <rect x="189" y="218" width="7" height="94" rx="2" fill="url(#spectrum)" />
        <rect x="202" y="240" width="7" height="72" rx="2" fill="url(#spectrum)" />
