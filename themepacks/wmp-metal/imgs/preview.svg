        <rect x="254" y="236" width="7" height="76" rx="2" fill="url(#spectrum)" />
        <rect x="267" y="256" width="7" height="56" rx="2" fill="url(#spectrum)" />
        <rect x="280" y="244" width="7" height="68" rx="2" fill="url(#spectrum)" />
        <rect x="293" y="260" width="7" height="52" rx="2" fill="url(#spectrum)" />
