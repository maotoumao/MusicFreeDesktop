    <rect x="48" y="343" width="58" height="5" rx="2" fill="#e2e8ef" opacity="0.3" />
    <circle cx="268" cy="337" r="14" fill="#f0a020" />
    <path d="M264 330 L264 344 L274 337 Z" fill="#16202a" />
    <rect x="300" y="335" width="300" height="4" rx="2" fill="#ffffff" opacity="0.16" />
    <rect x="300" y="335" width="128" height="4" rx="2" fill="#f0a020" />
</svg>
