<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
    <defs>
        <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f6f6f8" />
            <stop offset="48%" stop-color="#ebebef" />
            <stop offset="100%" stop-color="#e0e0e5" />
        </linearGradient>
        <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fbfbfc" />
            <stop offset="100%" stop-color="#ebebef" />
        </linearGradient>
        <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#efeff3" />
            <stop offset="100%" stop-color="#e6e6ec" />
        </linearGradient>
        <linearGradient id="spectrum" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#78beff" stop-opacity="0.05" />
        </linearGradient>
    </defs>

    <rect width="640" height="360" fill="#f7f7f9" />

    <!-- 标题栏 -->
    <rect width="640" height="46" fill="url(#header)" />
    <rect y="45" width="640" height="1" fill="#000000" opacity="0.12" />
