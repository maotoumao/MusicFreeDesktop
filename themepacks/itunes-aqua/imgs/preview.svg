    <rect x="14" y="86" width="80" height="9" rx="4" fill="#1f1f24" opacity="0.26" />
    <rect x="8" y="122" width="124" height="22" rx="4" fill="#0a84ff" opacity="0.16" />
    <rect x="14" y="128" width="76" height="9" rx="4" fill="#0a84ff" opacity="0.9" />
    <rect x="14" y="152" width="88" height="9" rx="4" fill="#1f1f24" opacity="0.26" />

