    <rect x="120" y="12" width="150" height="22" rx="4" fill="#ffffff" stroke="#000000" stroke-opacity="0.08" />
    <circle cx="596" cy="23" r="6" fill="#2b2b31" opacity="0.35" />

    <!-- 侧栏 -->
    <rect y="46" width="140" height="268" fill="url(#side)" />
