        <rect x="202" y="244" width="7" height="68" rx="2" fill="url(#spectrum)" />
        <rect x="215" y="214" width="7" height="98" rx="2" fill="url(#spectrum)" />
        <rect x="228" y="234" width="7" height="78" rx="2" fill="url(#spectrum)" />
