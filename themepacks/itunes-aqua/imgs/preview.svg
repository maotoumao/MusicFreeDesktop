    <rect x="156" y="70" width="330" height="8" rx="4" fill="#1f1f24" opacity="0.4" />
    <rect x="156" y="92" width="250" height="8" rx="4" fill="#1f1f24" opacity="0.2" />
    <rect x="150" y="106" width="490" height="26" rx="3" fill="#0a84ff" opacity="0.16" />
    <rect x="156" y="114" width="268" height="8" rx="4" fill="#0a84ff" opacity="0.75" />
    <rect x="156" y="142" width="300" height="8" rx="4" fill="#1f1f24" opacity="0.2" />
    <rect x="156" y="164" width="240" height="8" rx="4" fill="#1f1f24" opacity="0.2" />

