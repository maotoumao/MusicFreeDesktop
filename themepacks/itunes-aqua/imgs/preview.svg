    <path d="M264 330 L264 344 L274 337 Z" fill="#ffffff" />
    <rect x="300" y="335" width="300" height="4" rx="2" fill="#000000" opacity="0.12" />
    <rect x="300" y="335" width="128" height="4" rx="2" fill="#0a84ff" />
</svg>
